/* دکمهٔ نصب */
let _ip;const _ios=/iphone|ipad|ipod/i.test(navigator.userAgent),_sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function _btn(t,f){if(_sa||document.getElementById('inst'))return;const b=document.createElement('button');b.id='inst';b.textContent=t;b.onclick=f;b.style.cssText='position:fixed;bottom:14px;left:14px;z-index:60;border:0;border-radius:99px;padding:10px 16px;color:#fff;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(120deg,#6c47ff,#ec2f8c);box-shadow:0 8px 24px #6c47ff66';document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(b));if(document.body)document.body.appendChild(b)}

if(_ios&&!_sa)_btn('📲 نصب روی آیفون',()=>alert('در Safari دکمهٔ Share (مربع با فلش) را بزنید و «Add to Home Screen» را انتخاب کنید.'));

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#14122b;--mute:#6f6c8a;--line:#e6e3f3;--brand:#6c47ff;--ok:#12a150;--okbg:#e5f7ec;--danger:#e5484d;
--l1:#ef4444;--l2:#f59e0b;--l3:#06a8c9;--l4:#6c47ff;--l5:#ec2f8c}
@media (prefers-color-scheme:dark){:root{--bg:#0f0e1d;--card:#181730;--ink:#eeeaff;--mute:#a29fc4;--line:#2a2850;--brand:#8f74ff;--okbg:#10301f;--ok:#3ddc84}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;background:var(--bg) radial-gradient(var(--line) 1px,transparent 1px) 0 0/20px 20px;color:var(--ink);font-size:14px;display:flex;flex-direction:column}
body.stu{display:block;height:auto;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.lv1{--c:var(--l1)}.lv2{--c:var(--l2)}.lv3{--c:var(--l3)}.lv4{--c:var(--l4)}.lv5{--c:var(--l5)}
header{background:linear-gradient(115deg,#14122b,#2b1a72 70%,#4a1d78);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{background:#14122b;border-radius:11px;padding:4px;flex:none}
.logo h1{font-size:17px;margin:0;font-weight:800}
.tabs{display:flex;gap:3px;background:#ffffff1c;padding:3px;border-radius:12px}
.tab{border:0;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;color:#ffffffbb;transition:.15s}
.tab.on{background:#fff;color:#14122b;font-weight:700}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:10px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--brand)}
header .btn{background:#ffffff18;border-color:#ffffff30;color:#fff;padding:6px 10px}
header .btn:hover{background:#ffffff30}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.big{width:100%;padding:12px;font-weight:700;font-size:15px}
.btn.dng{color:var(--danger)}
main{flex:1;display:flex;min-height:0}
aside{width:290px;background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside .s{padding:10px}
aside input[type=search]{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#list{overflow:auto;flex:1}
.st{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:3px 8px}
.st:hover{background:var(--bg)}
.st.on{background:color-mix(in srgb,var(--brand) 12%,transparent);box-shadow:inset -4px 0 var(--brand)}
.st b{font-weight:600}
.st small{color:var(--mute);direction:ltr;text-align:right}
.bar{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#00b8d9,#6c47ff,#ec2f8c)}
section#view{flex:1;overflow:auto;padding:18px}
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.shead h2{margin:0;font-size:22px;font-weight:800}
.shead .num{color:var(--mute);direction:ltr}
.shead select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.kpi{display:flex;gap:8px;flex-wrap:wrap}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;text-align:center;min-width:76px}
.kpi b{display:block;font-size:19px}.kpi small{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--line)}
.card.done{border-top-color:var(--ok)}
.card.final{grid-column:1/-1;border-top-color:var(--brand)}
.card.hl{outline:3px solid var(--brand)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch b{font-size:15px}
.chk{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--ok)}
.seg{display:flex;gap:5px}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);padding:6px 0;border-radius:10px;cursor:pointer;font-size:19px;filter:grayscale(.8);opacity:.7;transition:.15s}
.seg button:hover{opacity:1;filter:none}
.seg button.on{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:var(--c);filter:none;opacity:1;transform:translateY(-2px) scale(1.06)}
.lb{font-size:12px;color:var(--mute);min-height:18px}
.lb b{color:var(--c)}
.chip,.c[class*=lv]{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:8px;font-weight:700}
.chip{padding:2px 9px;font-size:13px;white-space:nowrap}
.up{display:flex;gap:6px;align-items:center}
.up label{cursor:pointer}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.th{position:relative;width:78px;height:58px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#000;cursor:pointer}
.th img,.th video,.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th .x{position:absolute;top:2px;left:2px;background:#000a;color:#fff;border:0;border-radius:50%;width:18px;height:18px;line-height:16px;font-size:12px;cursor:pointer;padding:0}
textarea.note{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:7px 9px;resize:vertical;min-height:36px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s}
.tile:hover{transform:translateY(-3px);border-color:var(--brand)}
.tile>img,.tile>video,.tile .ph{height:150px;width:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--mute)}
.tl{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px}
.mx{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:calc(100vh - 150px)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--card)}
th{background:var(--bg);position:sticky;top:0;z-index:2;font-weight:600}
td.nm,th.nm{text-align:right;position:sticky;right:0;z-index:1;min-width:170px}
th.nm{z-index:4}
.lt{position:sticky;left:0;z-index:1;min-width:64px;box-shadow:6px 0 8px -6px #0003;font-weight:700}
.lt2{left:64px}
th.lt{z-index:4;background:var(--bg)}
tfoot td{position:sticky;bottom:0;background:var(--bg);font-weight:700;border-top:2px solid var(--line);z-index:2}
tfoot td.nm{z-index:3}
.c{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:28px;padding:0 4px;border-radius:8px;cursor:pointer;font-size:12px;border:1px solid var(--line);color:var(--mute)}
.c.d{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.c:hover{transform:scale(1.1)}
.leg{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;color:var(--mute);font-size:12px;align-items:center}
.leg .c{cursor:default;pointer-events:none}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:18px;max-width:96vw;max-height:94vh;overflow:auto;min-width:320px}
.modal img,.modal video{max-width:90vw;max-height:78vh;display:block;margin:auto;border-radius:10px}
.fm{display:flex;flex-direction:column;gap:10px;max-width:560px}
.fm input,.fm textarea{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.fm small{color:var(--mute);line-height:1.8}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.empty{color:var(--mute);padding:40px;text-align:center}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:10px;display:none;z-index:99}
/* student mode */
.sw{max-width:520px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sw label{display:flex;flex-direction:column;gap:5px;font-weight:600}
.sw select{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.sr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
/* ===== v2 modern ===== */
body{background-color:var(--bg);background-image:radial-gradient(60vw 40vh at 85% -10%,#6c47ff26,transparent),radial-gradient(50vw 40vh at 0% 100%,#ff2e8822,transparent),radial-gradient(40vw 30vh at 100% 90%,#00b8d91f,transparent);background-attachment:fixed}
header{background:linear-gradient(120deg,#14122b,#3a1d8f,#a3207a,#14122b);background-size:300% 100%;animation:hg 14s ease infinite;padding:12px 18px;position:relative;z-index:5;box-shadow:0 8px 30px #6c47ff33}
@keyframes hg{50%{background-position:100% 0}}
.logo h1{font-size:19px;line-height:1.25}
.logo small{display:block;font-weight:400;font-size:11.5px;opacity:.8;margin-top:2px}
.logo circle{transform-box:fill-box;transform-origin:center;animation:fl 3.6s ease-in-out infinite}
.logo circle:nth-child(2){animation-delay:-1.2s}.logo circle:nth-child(3){animation-delay:-2.4s}
@keyframes fl{50%{transform:scale(1.2) translateY(-2px)}}
.tab.on{box-shadow:0 4px 14px #0004;transform:translateY(-1px)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px #6c47ff2a}
.btn.pri{background:linear-gradient(120deg,#6c47ff,#ec2f8c);border:0}
.card,.tile,.sr{transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px #6c47ff22}
.card{border-radius:20px}
#view.in .card,#view.in .tile,#view.in .mx{animation:up .5s both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.seg button{font-size:23px;padding:10px 0;transition:.25s cubic-bezier(.34,1.56,.64,1)}
.seg button:hover{transform:translateY(-3px) scale(1.12)}
.seg button.on{transform:translateY(-3px) scale(1.12);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 40%,transparent)}
.lb{min-height:20px;font-size:12.5px}
.kpi div{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,var(--card)),var(--card))}
.kpi b{background:linear-gradient(90deg,#00b8d9,#6c47ff,#ec2f8c);-webkit-background-clip:text;background-clip:text;color:transparent}
.c[class*=lv]{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 10%,transparent))}
.pt{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:99;animation:pt .7s ease-out forwards}
@keyframes pt{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.l0{left:0}.l1{left:64px}.l2{left:128px}.l3{left:192px}
tfoot td{height:38px}tfoot tr.f1 td{bottom:38px}tfoot tr.f2 td{bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--brand) 8%,var(--card))}
#live{font-size:11.5px;opacity:.85}
.gd{margin:0;padding-inline-start:20px;line-height:2;max-width:560px}
.sw .seg button{font-size:25px;padding:12px 0}
.sw .logo{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:760px){aside{display:none!important}main{display:block}}

/* ===== v3 ===== */
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1;font-size:inherit}
.seg .em{font-size:25px}.seg .nu{font-size:12px;font-weight:800;color:var(--c)}
.seg button:disabled{opacity:.3;cursor:not-allowed;filter:grayscale(1);transform:none!important;box-shadow:none!important}
.pc{display:flex;gap:4px;height:120px;margin:10px 0 2px}
.pcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.pcol .pb2{flex:1;width:100%;background:var(--line);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.pcol .pb2 i{width:100%;border-radius:6px;background:linear-gradient(0deg,#00b8d9,#6c47ff,#ec2f8c);animation:grow .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes grow{from{height:0!important}}
.pcol .tk{height:16px;color:var(--ok);font-weight:800;font-size:13px}.pcol small{color:var(--mute);font-size:11px}
.ringw{display:flex;align-items:center;gap:12px}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring b{background:var(--card);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-width:44px;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;position:relative;transition:.2s}
.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand);transform:translateY(-2px)}
.chips button.d{border-color:var(--ok)}
.chips button.d::after{content:'✓';position:absolute;top:-6px;left:-4px;background:var(--ok);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:grid;place-items:center}
.tabs2{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:14px;border:1px solid var(--line)}
.tabs2 button{flex:1;border:0;background:none;padding:10px;border-radius:11px;cursor:pointer;font-weight:600}
.tabs2 button.on{background:linear-gradient(120deg,#6c47ff,#ec2f8c);color:#fff}
.hello{display:flex;justify-content:space-between;align-items:center}.hello h2{margin:2px 0;font-size:20px}.hello small{color:var(--mute)}
.upl{text-align:center;cursor:pointer;display:block}
.pg{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00b8d9,#ec2f8c);transition:.3s}
.doc{display:flex;align-items:center;justify-content:center;font-size:26px;width:100%;height:100%;background:var(--bg)}
.pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;text-shadow:0 1px 6px #000;pointer-events:none}
.modal iframe{width:min(92vw,820px);height:70vh;border:0;border-radius:10px;background:#000}
.idea p{margin:4px 0;white-space:pre-wrap}.idea{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sw .t{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);width:100%;font-size:16px}
#num{direction:ltr;text-align:center;font-size:20px;letter-spacing:1px}

/* ===== v4 · ES1 modern ===== */
.sw{max-width:560px}
.hero{text-align:center;padding:26px 10px 6px}.hero .lg{display:inline-grid;animation:fl2 4s ease-in-out infinite}
.hero h1{margin:8px 0 2px;font-size:24px;font-weight:800;background:linear-gradient(90deg,#00b8d9,#6c47ff,#ec2f8c);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes fl2{50%{transform:translateY(-6px) rotate(-6deg)}}
.tl3{display:flex;flex-direction:column;gap:12px;margin:4px 0}
.big3{position:relative;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;width:100%;text-align:right;text-decoration:none;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--a);border-radius:20px;padding:14px 16px;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;animation:up .5s both;animation-delay:calc(var(--i,0)*90ms)}
.big3:hover{transform:translateY(-4px);box-shadow:0 14px 34px color-mix(in srgb,var(--a) 28%,transparent)}.big3:active{transform:scale(.98)}
.big3 .ic{grid-row:1/3;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:27px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 18px color-mix(in srgb,var(--a) 40%,transparent)}
.big3 b{font-size:16px;font-weight:800;align-self:end}.big3 small{color:var(--mute);align-self:start}
.big3 em{position:absolute;top:10px;left:12px;background:linear-gradient(120deg,var(--a),var(--b));color:#fff;border-radius:99px;padding:1px 10px;font-style:normal;font-weight:800;font-size:12px}
.tlink{display:block;text-align:center;color:var(--mute);text-decoration:none;padding:8px}.tlink:hover{color:var(--brand)}
.pbox iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000;margin-top:6px}.pbox img{width:100%;border-radius:12px;margin-top:6px}
.sr .btn{display:block}
.upl{border:2px dashed color-mix(in srgb,var(--brand) 45%,var(--line));background:color-mix(in srgb,var(--brand) 6%,var(--card));padding:16px;font-weight:700;border-radius:14px}
.upl:hover{background:color-mix(in srgb,var(--brand) 12%,var(--card))}
#upl{position:fixed;bottom:16px;left:0;right:0;margin-inline:auto;width:min(94vw,430px);z-index:90;display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:20px;padding:14px 16px;box-shadow:0 20px 50px #0005;animation:up .35s both}
#upl.ok{border-top-color:var(--ok)}#upl.er{border-top-color:var(--danger)}
.upr{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0)}
.upr b{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px}
#upl.ok .upr{background:var(--ok)}#upl.er .upr{background:var(--danger)}#upl.ok .upr b,#upl.er .upr b{background:none;color:#fff;font-size:24px}

@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}

body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);pointer-events:none;opacity:.5}

  *{scrollbar-width:auto;scrollbar-color:auto}

    background-image:linear-gradient(180deg,#00b8d9,#6c47ff 55%,#ec2f8c)}
  ::-webkit-scrollbar-thumb:horizontal{background-image:linear-gradient(90deg,#00b8d9,#6c47ff 55%,#ec2f8c)}

}

const framePoster=file=>new Promise(ok=>{
  const v=document.createElement('video'),url=URL.createObjectURL(file);let done=false;
  const fin=b=>{if(done)return;done=true;clearTimeout(tm);URL.revokeObjectURL(url);v.removeAttribute('src');ok(b)},tm=setTimeout(()=>fin(null),12000);
  v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;v.onerror=()=>fin(null);
  v.onloadeddata=()=>{try{v.currentTime=Math.min(1,Math.max(.05,(v.duration||2)/3))}catch(e){fin(null)}};
  v.onseeked=()=>{try{const w=v.videoWidth,h=v.videoHeight;if(!w||!h)return fin(null);const k=Math.min(1,960/w),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);

function teacher(){
let db,students=[],recs={},mediaByKey={},ideaByKey={},srv={files:[],ideas:[],done:[]},peer={},cur=null,tab='stu',filter='',gs=1,gf='all',msx=1,lastKey='';
FL=()=>srv.files;
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('class-tracker',2);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('students'))d.createObjectStore('students',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'k'});
    if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:'id',autoIncrement:true}).createIndex('k','k');
    if(!d.objectStoreNames.contains('votes'))d.createObjectStore('votes',{keyPath:'k'});};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const p=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const all=s=>p(tx(s).getAll());
const put=(s,v)=>p(tx(s,'readwrite').put(v));
const del=(s,k)=>p(tx(s,'readwrite').delete(k));
const putMany=(s,arr)=>new Promise((ok,no)=>{const t=db.transaction(s,'readwrite');arr.forEach(v=>t.objectStore(s).put(v));t.oncomplete=ok;t.onerror=()=>no(t.error);});
const key=(sid,s)=>sid+'|'+s;
const W=()=>+cfg.get('w',50)/100;
const sessions=()=>Array.from({length:N},(_,i)=>i+1);
const rec=(sid,s)=>recs[key(sid,s)]||{k:key(sid,s),sid,s,done:false,rating:0,note:''};
const saveRec=async r=>{recs[r.k]=r;await put('records',r);};
const prog=sid=>sessions().filter(s=>rec(sid,s).done).length;
const peerAvg=(sid,s)=>{const o=peer[key(sid,s)];return o?o.sum/o.n:null;};
const score=(sid,s)=>{const t=rec(sid,s).rating,p=peerAvg(sid,s);return t&&p!=null?t*(1-W())+p*W():(t||p);};
const stats=sid=>{let tot=0,n=0;sessions().forEach(s=>{const x=score(sid,s);if(x!=null){tot+=x;n++}});return{tot,n,avg:n?tot/n:null};};

async function load(){
  students=await all('students');
  if(!students.length){for(const s of SEED)await put('students',{...s});students=await all('students');}
  recs={};for(const r of await all('records')){if(r.rating&&!r.m){r.rating={1:2,2:3,3:4}[r.rating]||r.rating;r.m=1;await put('records',r);}recs[r.k]=r;}
  students.sort((a,b)=>a.name.localeCompare(b.name,'fa'));
  const byNum={};students.forEach(s=>byNum[s.num]=s);peer={};mediaByKey={};ideaByKey={};
  srv.files.forEach(f=>{const t=byNum[f.num];if(t)(mediaByKey[key(t.id,f.s)]??=[]).push(f);});
  srv.ideas.forEach(i=>{const t=byNum[i.num];if(t)ideaByKey[key(t.id,i.s)]=i;});
  (await all('votes')).forEach(v=>{const st=byNum[v.target];if(!st)return;const o=peer[key(st.id,v.s)]??={sum:0,n:0};o.sum+=v.score;o.n++;});
}
const allM=()=>Object.values(mediaByKey).flat();
function openM(id){const m=srv.files.find(x=>x.id===id);if(!m)return;
  $('pb').innerHTML=mFull(m)+`<div style="text-align:center;margin-top:8px;color:var(--mute)">${esc(m.name)} · <a href="${DR.view(m.id)}" target="_blank">باز کردن در Drive</a></div>`;$('pm').classList.add('on');}
const pushNotes=u=>{const l=[];students.forEach(st=>sessions().forEach(s=>{const r=recs[key(st.id,s)];if(r&&r.note)l.push({num:st.num,s,text:r.note})}));if(l.length)post(u,{a:'note',key:cfg.get('key',''),list:l}).catch(()=>{})};
const pushRoster=()=>{const u=(cfg.get('url','')||API),k=cfg.get('key','');if(u&&k)post(u,{a:'roster',key:k,list:students.map(s=>({num:s.num,name:s.name}))}).catch(()=>{});};

function renderList(){

      <div class="bar"><i style="width:${prog(s.id)/N*100}%"></i></div></div>`}).join('')||'<div class="empty">موردی یافت نشد</div>';
}

function card(sid,s){
  const r=rec(sid,s),ms=mediaByKey[key(sid,s)]||[],me=ms.filter(f=>f.kind==='media'),idf=ms.filter(f=>f.kind==='idea'),idea=ideaByKey[key(sid,s)],x=score(sid,s),o=peer[key(sid,s)];
  return `<div class="card ${r.done?'done':''} ${s===FINAL?'final':''}" id="c${s}" data-s="${s}" style="--i:${s}">
    <div class="ch"><b>${sname(s)}</b>${x?`<span class="chip lv${lvOf(x)}" title="امتیاز نهایی جلسه">${fa(x)}</span>`:''}

    <div class="idea"><b>💡 ایده</b>${idea&&idea.text?`<p>${esc(idea.text)}</p>`:''}${idf.map(f=>`<span class="btn" style="display:inline-flex;gap:6px;align-items:center">${idLink(f)}</span>`).join(' ')}${(idea&&idea.text)||idf.length?'':'<small class="lb">ثبت نشده</small>'}</div>

    if(u)post(u,{a:'done',key:cfg.get('key',''),num:st.num,s,done:r.done}).then(x=>{if(x.err)toast(x.err)}).catch(()=>toast('ثبت روی سرور ناموفق بود'));
    renderStudent();renderList();}
  if(e.target.classList.contains('note')){const r=rec(cur,s);r.note=e.target.value;await saveRec(r);const st=students.find(x=>x.id===cur),nu=(cfg.get('url','')||API);
    if(nu)post(nu,{a:'note',key:cfg.get('key',''),list:[{num:st.num,s,text:r.note}]}).then(x=>x.err?toast(x.err):toast('یادداشت برای دانشجو ثبت شد ✓')).catch(()=>toast('ثبت یادداشت روی سرور ناموفق بود'));}
});
$('pm').onclick=e=>{if(e.target.id==='pm'){$('pm').classList.remove('on');$('pb').innerHTML='';}};
$('pm').addEventListener('click',e=>{const n=e.target.closest('[data-vn]');if(n){VW.i+=+n.dataset.vn;drawV();}if(e.target.id==='vx'){$('pm').classList.remove('on');$('pb').innerHTML='';}});
document.addEventListener('keydown',e=>{if($('pm').classList.contains('on')&&$('pb').querySelector('.vwrap')){const d=e.key==='ArrowLeft'?1:e.key==='ArrowRight'?-1:0,n=VW.i+d;if(d&&n>=0&&n<VW.l.length){VW.i=n;drawV();}}if(e.key==='Escape'){$('pm').classList.remove('on');$('pb').innerHTML='';$('fmod').classList.remove('on');}});

/* ---- add/edit student ---- */
function editStudent(id){
  const s=id?students.find(x=>x.id===id):{name:'',num:''};
  $('ff').innerHTML=`<h3 style="margin:0">${id?'ویرایش دانشجو':'دانشجوی جدید'}</h3>
    <input id="fn" placeholder="نام و نام خانوادگی" value="${esc(s.name)}">
    <input id="fu2" placeholder="شماره دانشجویی" style="direction:ltr;text-align:right" value="${esc(s.num)}">
    <div class="row"><button class="btn pri" id="fs">ذخیره</button><button class="btn" id="fc">انصراف</button></div>`;
  $('fmod').classList.add('on');
  $('fc').onclick=()=>$('fmod').classList.remove('on');
  $('fs').onclick=async()=>{const name=$('fn').value.trim(),num=$('fu2').value.trim();
    if(!name)return toast('نام را وارد کنید');
    const nid=await put('students',{...s,name,num});$('fmod').classList.remove('on');await load();cur=id||nid;render();pushRoster();};
}
$('bAdd').onclick=()=>editStudent(null);

/* ---- sync & settings ---- */
async function sync(q){
  const u=(cfg.get('url','')||API);if(!u){if(q)return;toast('ابتدا آدرس اتصال را در ⚙️ تنظیمات وارد کنید');return settings();}
  if(!q)toast('در حال دریافت اطلاعات…');
  if(!sync.r){sync.r=1;pushRoster();pushNotes(u);}
  try{const a=await post(u,{a:'all',key:cfg.get('key','')});if(a.err){if(/کلید/.test(a.err)){cfg.set('key','');location.replace(location.pathname+'?t=1');return}if(!q)toast(a.err);return;}
    if(a.n&&a.n!==N){setN(a.n);cfg.set('n',a.n);}
    srv={files:a.files||[],ideas:a.ideas||[],done:a.done||[]};
    const best={};(a.votes||[]).forEach(v=>{if(v.rater===v.target||!(v.score>=1&&v.score<=5))return;const k=v.rater+'|'+v.s+'|'+v.target;if(!best[k]||v.t>=best[k].t)best[k]={...v,k};});
    await putMany('votes',Object.values(best));
    const byNum={};students.forEach(s=>byNum[s.num]=s);
    for(const [num,s,f] of srv.done){const t=byNum[num];if(!t)continue;const r=rec(t.id,s);if(r.done!==!!f){r.done=!!f;await saveRec(r);}}
    await load();if(!(q&&document.activeElement&&document.activeElement.tagName==='TEXTAREA'))render();
    $('live').textContent='● به‌روز '+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
    if(!q)toast(fa(a.files.length)+' فایل و '+fa(Object.keys(best).length)+' رأی دریافت شد ✓');
  }catch(e){if(!q)toast('اتصال ناموفق بود؛ آدرس و دسترسی (Anyone) را بررسی کنید');}
}
function settings(){
  $('ff').innerHTML=`<h3 style="margin:0">⚙️ اتصال و تنظیمات</h3>
    <small><b>راه‌اندازی:</b> کد فایل <b>Code.gs</b> را در Apps Script بگذارید و Deploy کنید؛ سپس آدرس Web app و «کلید معلم» (همان TEACHER_KEY) را اینجا وارد کنید. فایل‌ها در پوشهٔ <b>ClassTracker</b> در Google Drive ذخیره می‌شوند.</small>
    <input id="su" placeholder="آدرس Web app (https://script.google.com/macros/s/…/exec)" style="direction:ltr" value="${esc((cfg.get('url','')||API))}">
    <input id="sk" placeholder="کلید معلم (TEACHER_KEY)" style="direction:ltr" value="${esc(cfg.get('key',''))}">
    <label>وزن رأی همکلاسی‌ها در امتیاز نهایی: <b id="wv">${fa(W()*100)}</b>٪ (بقیه = امتیاز استاد)<input type="range" id="sw" min="0" max="100" step="10" value="${W()*100}"></label>
    <label class="snx">تعداد جلسات: <button class="btn" id="nm" type="button">−</button><input id="sn" type="number" min="1" max="30" value="${N}"><button class="btn" id="np" type="button">＋</button><small>آخرین جلسه = ژوری و تحویل نهایی. کم‌کردن، اطلاعات را پاک نمی‌کند.</small></label>
    <input id="sh" placeholder="آدرس میزبانی همین فایل (مثلاً https://you.github.io/repo/)" style="direction:ltr" value="${esc(cfg.get('host',''))}">
    <div class="row"><button class="btn pri" id="ss">ذخیره</button><button class="btn" id="cl">کپی لینک دانشجو</button><button class="btn" id="fc">بستن</button></div>`;
  $('fmod').classList.add('on');
  const save=()=>{const n=Math.max(1,Math.min(30,+$('sn').value||N));if(n!==N){cfg.set('n',n);setN(n);post(($('su').value.trim()||API),{a:'cfg',key:$('sk').value.trim(),n}).catch(()=>{});}cfg.set('url',$('su').value.trim());cfg.set('key',$('sk').value.trim());cfg.set('w',$('sw').value);cfg.set('host',$('sh').value.trim());};
  $('sw').oninput=()=>$('wv').textContent=fa($('sw').value);
  $('nm').onclick=()=>{$('sn').value=Math.max(1,+$('sn').value-1)};$('np').onclick=()=>{$('sn').value=Math.min(30,+$('sn').value+1)};
  
  $('fc').onclick=()=>$('fmod').classList.remove('on');
  $('ss').onclick=()=>{save();$('fmod').classList.remove('on');sync.r=0;render();sync();toast('ذخیره شد ✓');};
  $('cl').onclick=()=>{save();const h=cfg.get('host','');if(!h||!(cfg.get('url','')||API))return toast('آدرس اتصال و آدرس میزبانی را وارد کنید');copy(h.split('?')[0]+'?s=1&u='+encodeURIComponent((cfg.get('url','')||API)));};
}
const matCfg=()=>({u:(cfg.get('url','')||API),k:cfg.get('key','')});
async function upMat(fs){const{u,k}=matCfg();UP.begin(fs.length);
  try{for(let i=0;i<fs.length;i++)await uploadWithPoster(u,{num:'teacher',key:k},fs[i],'material',msx,i);UP.end(true,'آپلود کامل شد 🎉');burst(document.body);}catch(x){UP.end(false,'آپلود ناموفق: '+x.message)}
  await sync(true);render();}
function renderMaterials(){
  const{u,k}=matCfg();
  if(!u||!k){$('view').innerHTML='<div class="empty">ابتدا آدرس اتصال و کلید معلم را در ⚙️ تنظیمات وارد کنید.<br><br><button class="btn pri" id="bSet2">⚙️ باز کردن تنظیمات</button></div>';return;}
  const s=msx,L=srv.files.filter(f=>f.kind==='material'&&f.s===s),t=srv.ideas.find(i=>i.num==='teacher'&&i.s===s),has=x=>srv.files.some(f=>f.kind==='material'&&f.s===x)||srv.ideas.some(i=>i.num==='teacher'&&i.s===x&&i.text);
  $('view').innerHTML=`<div class="gh"><div class="mi">📚</div><div><h2>مطالب تدریس‌شده</h2><div class="sub">هر چه اینجا بگذارید، دانشجوها در بخش «مطالب استاد» می‌بینند</div></div>
      <span class="sp"></span><div class="kpi"><div><b>${cu(srv.files.filter(f=>f.kind==='material').length)}</b><small>فایل در کل</small></div><div><b>${cu(sessions().filter(has).length)}</b><small>جلسه دارای مطلب</small></div></div></div>
    <div class="reel">${sessions().map(x=>`<button class="rl ${x===s?'on':''}" data-ms="${x}" style="--q:${has(x)?1:0}">${fa(x)}<i></i></button>`).join('')}</div>
    <div class="mwrap"><div class="sr"><b>✍️ توضیح / خلاصهٔ درس — ${sname(s)}</b><textarea id="mt" rows="6" placeholder="توضیح/خلاصهٔ درس این جلسه…">${esc(t?t.text:'')}</textarea><button class="btn pri" id="mts">ذخیره توضیح</button></div>
      <div class="sr"><b>📎 فایل‌های ${sname(s)}</b><label class="stg emp upz"><span class="fl">📤</span><b>فایل را اینجا رها کنید یا کلیک کنید</b><small>PDF، ویدئو، تصویر، اسلاید …</small><input type="file" id="mf" multiple hidden></label></div></div>
    ${L.length?`<div class="mgrid mg2">${L.map(f=>`<div class="mc" data-m="${f.id}">${cover(f,520)}${isVid(f)?'<span class="stg-pl"><i>▶</i></span>':''}<span class="mcl">${esc(f.name)}</span><button class="stg-x" data-mx="${f.id}" title="حذف">×</button></div>`).join('')}</div>`:'<div class="empty">هنوز فایلی برای این جلسه نگذاشته‌اید</div>'}`;
}
function guide(){$('ff').innerHTML=`<h3 style="margin:0">❓ روند کار</h3><ol class="gd">
<li><b>یک‌بار راه‌اندازی:</b> در ⚙️ آدرس Web app، کلید معلم و آدرس میزبانی را وارد کنید و «کپی لینک دانشجو» را در گروه بفرستید.</li>
<li>دانشجو با شماره دانشجویی وارد صفحهٔ خودش می‌شود و برای هر جلسه ویدئو/فریم و ایده (متن یا PDF/DOC) آپلود می‌کند؛ همه چیز در Google Drive ذخیره می‌شود.</li>
<li>کارها خودکار در کارت هر جلسه نمایش داده می‌شوند (⟳ برای دریافت فوری). با تیک «تکمیل شد» جلسه کامل و در نمودار پایین صفحه ثبت می‌شود.</li>
<li>«ویترین کارها» ← انتخاب جلسه ← «لینک امتیازدهی این جلسه» را برای کلاس بفرستید. دانشجو باید کار را ببیند تا امتیاز ۱ تا ۵ فعال شود.</li>
<li>جلسهٔ ۱۲ = ژوری و تحویل نهایی. امتیاز جلسه = امتیاز شما و میانگین همکلاسی‌ها با وزن ⚙️.</li>
<li>دانشجو در صفحهٔ خانه روی دایرهٔ عکس می‌زند و سلفی یا عکس پروفایل می‌گذارد؛ عکس در همهٔ بخش‌ها کنار نام دیده می‌شود. فریم ویدئوها هم هنگام آپلود از روی گوشی دانشجو گرفته می‌شود تا کادرها پر شوند.</li>
<li>تب «مطالب تدریس‌شده» (بعد از ویترین): توضیح و فایل هر جلسه را بگذارید؛ دانشجوها در «مطالب استاد» می‌بینند.</li></ol>
<div class="row"><button class="btn pri" id="fc">فهمیدم</button></div>`;$('fmod').classList.add('on');$('fc').onclick=()=>$('fmod').classList.remove('on');}
$('bSet').onclick=settings;$('bOut').onclick=()=>{cfg.set('key','');location.href=location.pathname;};$('bHelp').onclick=guide;$('bSync').onclick=sync;

/* ---- export / backup ---- */
const dl=(name,blob)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();};
$('bCsv').onclick=()=>{
  const H=['نام و نام خانوادگی','شماره دانشجویی'];
  sessions().forEach(s=>H.push(sname(s)+' - تحویل',sname(s)+' - امتیاز استاد',sname(s)+' - میانگین همکلاسی',sname(s)+' - نهایی'));
  H.push('مجموع','میانگین کل');
  const rows=[H,...students.map(st=>{const row=[st.name,'\t'+st.num];
    sessions().forEach(s=>{const r=rec(st.id,s),pa=peerAvg(st.id,s),x=score(st.id,s);
      row.push(r.done?'بله':'خیر',r.rating?LV[r.rating][0]+' ('+r.rating+')':'',pa==null?'':pa.toFixed(2),x==null?'':x.toFixed(2));});
    const t=stats(st.id);row.push(t.tot.toFixed(2),t.avg==null?'':t.avg.toFixed(2));return row;})];
  dl('class-report.csv',new Blob(['\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
};
$('bBak').onclick=async()=>{
  const d={v:2,students:await all('students'),records:await all('records'),votes:await all('votes'),media:(await all('media')).map(m=>({k:m.k,name:m.name,type:m.blob.type}))};
  dl('class-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(d)],{type:'application/json'}));
  toast('پشتیبان (بدون خود فایل‌های تصویر/ویدئو) ذخیره شد');
};
$('bRes').onclick=()=>$('fRes').click();
$('fRes').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!confirm('اطلاعات فعلی (دانشجوها، تیک‌ها و امتیازها) با فایل پشتیبان جایگزین شود؟ فایل‌های آپلودشده دست‌نخورده می‌مانند.'))return;
    for(const s of await all('students'))await del('students',s.id);
    for(const r of await all('records'))await del('records',r.k);
    for(const v of await all('votes'))await del('votes',v.k);
    for(const s of d.students)await put('students',s);
    for(const r of d.records)await put('records',r);
    for(const v of d.votes||[])await put('votes',v);
    await load();cur=null;render();toast('بازیابی انجام شد');
  }catch(err){alert('فایل پشتیبان معتبر نیست.');}
  e.target.value='';};

(async()=>{
  $('lg').innerHTML=LOGO;
  db=await open();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  await load();cur=students[0]?.id;render();movePill();addEventListener('resize',movePill);document.fonts&&document.fonts.ready.then(movePill);sync(true);setInterval(()=>{if(!document.hidden)sync(true)},45000);
})();
}
function landing(){document.body.className='stu';
  document.body.innerHTML=`<div class="sw"><div class="hero"><span class="lg">${LOGO.replace(/36/g,'72')}</span><h1>کارگاه گرافیک و تبلیغات</h1><small class="lb">دانشگاه محقق اردبیل · ترم سه · استاد علی حسین عباس‌زاده</small></div>
  <div class="tl3"><a class="big3" href="?s=1" style="--a:#6c47ff;--b:#a855f7;--i:0"><span class="ic">🎒</span><b>ورود دانشجو</b><small>آپلود کار، ثبت ایده و امتیازدهی</small></a>
  <a class="big3" href="?t=1" style="--a:#ec2f8c;--b:#f97316;--i:1"><span class="ic">🎓</span><b>ورود استاد</b><small>جدول امتیازها، ویترین و مدیریت کلاس</small></a></div></div><div id="toast"></div>`;}
function tLogin(msg){document.body.className='stu';
  document.body.innerHTML=`<div class="sw"><div class="hero"><span class="lg">${LOGO.replace(/36/g,'72')}</span><h1>ورود استاد</h1></div>
  <div class="sr"><b>🎓 پنل استاد</b>${API?'':`<input id="tu" class="t" dir="ltr" placeholder="آدرس Web app (https://script.google.com/macros/s/…/exec)" value="${esc(cfg.get('url',''))}">`}
  <input id="tk" class="t" type="password" dir="ltr" placeholder="کلید معلم (TEACHER_KEY)" value="${esc(cfg.get('key',''))}">
  <button class="btn pri big" id="tg">ورود ✨</button><div class="lb" id="te" style="color:var(--danger)">${msg||''}</div></div><a class="tlink" href="?s=1">🎒 ورود دانشجو</a></div><div id="toast"></div>`;
  const go=async()=>{const url=API||$('tu').value.trim(),key=$('tk').value.trim(),te=$('te');if(!url||!key)return te.textContent='آدرس و کلید را وارد کنید';
    $('tg').disabled=true;te.textContent='در حال بررسی…';
    try{const r=await post(url,{a:'all',key});if(r.err){$('tg').disabled=false;return te.textContent=r.err}
      cfg.set('url',url);cfg.set('key',key);location.replace(location.pathname+'?t=1');}
    catch(e){$('tg').disabled=false;te.textContent=e.message||'اتصال برقرار نشد'}};
  $('tg').onclick=go;$('tk').onkeydown=e=>{if(e.key==='Enter')go()};}
if(Q.has('t'))((cfg.get('key','')&&(cfg.get('url','')||API))?teacher:tLogin)();
else if(Q.has('s')||cfg.get('num',''))student();
else landing();
</script>
